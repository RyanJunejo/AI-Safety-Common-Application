<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f5f7fa;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1b2430">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dfe4ea;border-radius:10px;padding:24px">
      <p style="margin:0 0 16px;font-weight:700;color:#1d4f91">SafetyApps</p>
      <h1 style="margin:0 0 12px;font-size:20px">Sign in to SafetyApps</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.5">Use this button to sign in. It works once and expires in an hour.</p>
      <p style="margin:0 0 20px">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#1d4f91;color:#ffffff;font-weight:600;text-decoration:none;padding:10px 18px;border-radius:8px">Sign in</a>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6675">If you didn’t ask to sign in, you can ignore this email. Signing in doesn’t turn on alerts.</p>
    </div>
  </body>
</html>
